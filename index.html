<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Boom</title>
  <meta name="description" content="Pixel Boom: blast pixel-art mosaics apart, tile by tile, with a slingshot full of bombs.">
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; --card: #f5f5f7; --accent: #e8762c; }
    @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #a1a1a6; --bg: #141428; --card: #1f1f3a; --accent: #ffb347; } }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 20px 64px; }
    .game { display: flex; gap: 20px; align-items: center; background: var(--card); border-radius: 24px; padding: 20px; }
    .game img { width: 112px; height: 112px; border-radius: 25px; flex: none; }
    h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    @media (max-width: 420px) { .game { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>
  <main>
    <div class="game">
      <img src="pixel-boom-icon.png" alt="Pixel Boom app icon">
      <div>
        <h1>Pixel Boom</h1>
        <p>Blast pixel-art mosaics apart, tile by tile, with a slingshot full of bombs.</p>
        <p class="muted">Coming soon to the App Store for iPhone.</p>
        <p><a href="privacy-policies/pixel-boom/">Privacy Policy</a></p>
      </div>
    </div>
  </main>
</body>
</html>
